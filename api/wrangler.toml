name = "7k-note-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# ประกาศอัตโนมัติทุกวัน 07:00 เวลาไทย (= 00:00 UTC)
[triggers]
crons = ["0 0 * * *"]

[vars]
# โดเมนของเว็บที่อนุญาตให้เรียก API (ใส่ * ตอน dev ได้)
ALLOWED_ORIGIN = "https://7k-note.pages.dev"  # + preview (xxxx.7k-note.pages.dev) และ localhost ได้อัตโนมัติ · ใส่ * = ยอมทุกเว็บ
# ลิงก์เว็บ (ใช้ทำลิงก์ในข้อความ Discord)
SITE_URL = "https://7k-note.pages.dev"
# ล็อกอินด้วย Discord: Application ID (เปิดเผยได้) — ส่วน Client Secret ตั้งด้วย  npx wrangler secret put DISCORD_CLIENT_SECRET
DISCORD_CLIENT_ID = "1553856052980621442"
# Discord user ID ที่เข้าหน้า /admin ได้ (คั่นด้วย ,) — bruhh_exe
ADMIN_DISCORD_IDS = "498371127601790976"

[[d1_databases]]
binding = "DB"
database_name = "7k-note"
# ได้จากคำสั่ง: npx wrangler d1 create 7k-note  (ตอน dev แบบ local ใช้ค่าอะไรก็ได้)
database_id = "0452d0ac-94bf-4c7d-b2da-820406af4ce6"
# ตอน dev แบบ local ใช้ฐานข้อมูลเดิมในเครื่อง (ข้อมูล local ผูกกับ id นี้)
preview_database_id = "00000000-0000-0000-0000-000000000000"

# Observability: Logs + Issues (ดูใน dashboard → 7k-note-api → Observability / Issues) — ต้องตรงกับที่ตั้งใน dashboard
# ไม่งั้น deploy.cmd รอบหน้าจะปิดกลับไปเอง · ห้าม console.log ข้อมูลลับ (webhook, edit key, token) เพราะ log ถูกเก็บไว้
# traces ปิดไว้ (ถ้าเปิดจะเก็บ URL ที่ worker เรียกออกไป รวมถึง webhook Discord)
[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

# dashboard เรียกว่า "issue_detection" แต่ใน wrangler ใช้ชื่อ issues (ต้อง wrangler 4.134+)
[observability.issues]
enabled = true
